name: hdt-canary

# Early-warning drift detector: users auto-update HDT while our CI builds against a
# pinned version, so a breaking change in the surfaces we bind at runtime
# (HearthMirror, ArenaPlaque, HearthDb) would otherwise stay invisible until a user
# reports "no data". This builds + tests against the LATEST official HDT release; a
# red run here means "bump the pin and fix the drift before users hit it".
on:
  workflow_dispatch:
  schedule:
    # Weekly (Wednesday) — offset from Friday's retrain so failures are attributable.
    - cron: '0 6 * * 3'

jobs:
  canary:
    runs-on: windows-latest
    # Writes only the pin-bump branch, and only through a PR: the pin decides which assemblies
    # every release is compiled against, so it is a decision, not a refresh like the card pool.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'  # keep in step with global.json

      - name: Resolve LATEST official HDT release
        id: hdt
        shell: pwsh
        run: |
          $pinned = (Get-Content hdt-version.txt -Raw).Trim()
          $tag = gh release view --repo HearthSim/HDT-Releases --json tagName -q .tagName
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tag)) {
            throw 'Could not resolve the latest HDT release tag.'
          }
          $latest = $tag.TrimStart('v')
          Write-Host "latest HDT: $latest (CI pin: $pinned)"
          if ($latest -eq $pinned) {
            Write-Host 'Latest matches the pin - this run duplicates build.yml, but stays as a heartbeat.'
          }
          $path = .\scripts\resolve-hdt.ps1 -Version $latest
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pinned=$pinned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build against latest HDT
        shell: pwsh
        run: dotnet build HdtArenaHelper.sln -c Release -warnaserror "/p:CI=true" "/p:HSDTPath=${{ steps.hdt.outputs.path }}"

      # The committed card pool is generated FROM HearthDb, so at a lagging pin the drift test
      # fails on data — a newer HDT ships newer cards — and that failure buries the one this job
      # exists to catch, a breaking change in the surfaces we bind at runtime. It also made the
      # canary permanently red, and a permanently red alarm is not an alarm. Regenerating first
      # asks the question this job is for: does the CODE still hold against the latest HDT?
      - name: Refresh the card pool against latest HDT
        shell: pwsh
        run: dotnet run --project HdtArenaHelper.Training -c Release "/p:HSDTPath=${{ steps.hdt.outputs.path }}" -- --dump-database

      - name: Test against latest HDT
        shell: pwsh
        run: dotnet test HdtArenaHelper.Tests/HdtArenaHelper.Tests.csproj -c Release "/p:HSDTPath=${{ steps.hdt.outputs.path }}" --no-build

      - name: Drift verdict
        shell: pwsh
        run: Write-Host "CANARY PASS - plugin builds and tests green against HDT ${{ steps.hdt.outputs.version }}."

      # Green against a version we are not pinned to is exactly when the pin should move, and
      # nobody was moving it: users auto-update HDT, so a stale pin means CI and the shipped DLL
      # are compiled against assemblies no user is running. A PR rather than a push to main
      # because a pin bump also moves the card pool and can move the goldens — that wants a human,
      # unlike card-database.yml's pool refresh, which asserts nothing.
      #
      # ONE reused branch, for the reason train.yml uses one: a branch per version would leave a
      # trail of open PRs bumping to versions already superseded.
      - name: Propose the pin bump
        if: success() && steps.hdt.outputs.version != steps.hdt.outputs.pinned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = '${{ steps.hdt.outputs.version }}'
          $branch = 'hdt-pin'
          # Only the pin file: the pool regenerated above belongs to card-database.yml, which
          # commits it once the pin has actually moved. Carrying it here would put a megabyte of
          # generated diff in front of the one line a reviewer has to decide about.
          Set-Content hdt-version.txt -Value $latest
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B $branch
          git add hdt-version.txt
          git commit -m "Pin HDT $latest"
          git push -u origin $branch --force
          @"
          The canary built and tested green against **HDT $latest** (pin: ${{ steps.hdt.outputs.pinned }}),
          so the pin can move.

          What merging this does: CI and the released DLL compile against $latest's reference
          assemblies, and ``card-database.yml`` reflects that HearthDb into the committed card pool on
          its next daily run. **Re-check the goldens afterwards** — a new pool can move the heuristic's
          display anchor, which is a scoring change and not a version bump.
          "@ | Out-File pin-body.md -Encoding utf8
          $existing = gh pr list --repo '${{ github.repository }}' --head $branch --state open --json number --jq '.[0].number'
          if ($existing) {
            gh pr edit $existing --repo '${{ github.repository }}' --title "Pin HDT $latest" --body-file pin-body.md
            Write-Host "Updated existing pin PR #$existing."
          } else {
            gh pr create --title "Pin HDT $latest" --body-file pin-body.md --repo '${{ github.repository }}'
          }
