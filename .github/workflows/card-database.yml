name: card-database

# Reflects HearthDb (the bundled card DB, pinned to HDT_VERSION) into
# docs/CardDatabase.md and Generated/CardDatabase.g.cs, and commits them
# straight to main when they changed. No PR review gate: a diff here is the
# pool moving with a patch, not a scoring decision.
#
# On licensing, do NOT read this as "no concern". HearthDb's CODE is MIT, but
# its card data comes from HearthSim/hsdata, which ships no license at all and
# is extracted from Blizzard's client — so these files redistribute Blizzard
# content, defensible under the Fan Content Policy and not under MIT. The
# distinction matters here because "it is public, so it is fair game" is the
# exact reasoning that cost this project a whole data source in 0.1.5. See
# AGENTS.md's data-sources section.
on:
  workflow_dispatch:
  schedule:
    # Daily: the commit-if-changed step makes a quiet day cost a CI run, not a
    # commit, so running daily just shortens how long a patch can go unreflected.
    - cron: '0 6 * * *'

concurrency:
  group: card-database
  cancel-in-progress: false

jobs:
  dump:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HDT_VERSION: '1.53.14'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'  # keep in step with global.json

      - name: Resolve pinned HDT reference assemblies
        id: hdt
        shell: pwsh
        run: |
          $path = .\scripts\resolve-hdt.ps1 -Version $env:HDT_VERSION
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Dump card database
        shell: pwsh
        run: dotnet run --project HdtArenaHelper.Training -c Release "/p:HSDTPath=${{ steps.hdt.outputs.path }}" -- --dump-cards

      - name: Commit if changed
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/CardDatabase.md Generated/CardDatabase.g.cs
          if (git diff --cached --quiet) {
            Write-Host 'no change: pool is unchanged since the last run.'
          } else {
            git commit -m 'Refresh the card database from HearthDb'
            git push
          }
