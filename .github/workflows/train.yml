name: retrain

# Re-fits the heuristic weights against live win-rate data and opens a PR with the
# weight diff. Never auto-merges: CONTRIBUTING requires a human review of the diff
# (and the golden tests must be updated from the trainer's printed values on adopt).
on:
  workflow_dispatch:
  schedule:
    # Weekly (Friday): weights describe the current card pool and rot with every
    # patch; the diff gate below means a quiet week costs a CI run, not a PR.
    - cron: '0 6 * * 5'

jobs:
  retrain:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HDT_VERSION: '1.53.14'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve pinned HDT reference assemblies
        id: hdt
        shell: pwsh
        run: |
          $path = .\scripts\resolve-hdt.ps1 -Version $env:HDT_VERSION
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Live fetch: HSReplay via curl (Cloudflare 403s the .NET stack; runner IPs may
      # still be blocked — the trainer fails loudly if so) + Firestone CDN.
      - name: Run trainer
        shell: pwsh
        run: dotnet run --project HdtArenaHelper.Training -c Release "/p:HSDTPath=${{ steps.hdt.outputs.path }}" | Tee-Object trainer.log

      - name: Open PR when the weights moved
        shell: pwsh
        run: |
          $gen = 'HdtArenaHelper.Training/arena_weights.generated.json'
          $committed = 'HdtArenaHelper.Training/arena_weights.json'
          if((Get-Content $gen -Raw) -eq (Get-Content $committed -Raw)) {
            Write-Host 'GATE PASS: weights unchanged, no PR.'
            exit 0
          }
          $branch = "retrain/$(Get-Date -Format yyyy-MM-dd)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          Copy-Item $gen $committed -Force
          git add $committed
          git commit -m 'Retrain heuristic weights against live arena data'
          git push -u origin $branch
          # The trainer log carries the weight diff and the golden values to paste.
          $diff = Get-Content trainer.log -Raw
          @"
          Automated re-fit. Review the weight diff below, then update the golden tests
          in HeuristicArenaDataSourceTests with the printed values before merging.

          ~~~
          $diff
          ~~~
          "@ | Out-File pr-body.md -Encoding utf8
          gh pr create --title "Retrain heuristic weights ($(Get-Date -Format yyyy-MM-dd))" --body-file pr-body.md --repo '${{ github.repository }}'
