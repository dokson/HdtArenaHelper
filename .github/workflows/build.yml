name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Pinned official HDT version whose reference assemblies we build against.
      HDT_VERSION: '1.53.14'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve pinned HDT reference assemblies
        id: hdt
        shell: pwsh
        run: |
          $path = .\scripts\resolve-hdt.ps1 -Version $env:HDT_VERSION
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Read plugin version
        id: ver
        shell: pwsh
        run: |
          $v = .\scripts\get-version.ps1
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Reward-hacking gate: fails on NEW disabled tests, warning suppressions, empty
      # catch blocks etc. (deliberate legacy ones live in .slopwatch/baseline.json).
      - name: Slopwatch
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run slopwatch analyze -d . --fail-on warning

      - name: Build
        shell: pwsh
        run: dotnet build HdtArenaHelper.sln -c Release -warnaserror "/p:HSDTPath=${{ steps.hdt.outputs.path }}"

      - name: Test
        shell: pwsh
        run: dotnet test HdtArenaHelper.Tests/HdtArenaHelper.Tests.csproj -c Release "/p:HSDTPath=${{ steps.hdt.outputs.path }}" --no-build

      - name: Package release zip
        id: pkg
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $stage = "dist/HdtArenaHelper"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "HdtArenaHelper/bin/Release/HdtArenaHelper.dll" $stage
          $zip = "dist/HdtArenaHelper-$ver.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@v7
        with:
          name: HdtArenaHelper-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release on version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = "v${{ steps.ver.outputs.version }}"

          # Tags MUST be 3-part (vMAJOR.MINOR.PATCH). The self-updater compares versions on
          # (major, minor, build) only — a 4-part tag like v0.1.2.1 would read as "not newer" than
          # an installed 0.1.2 and would never be installed, so a hotfix released that way would
          # reach nobody. The updater IS the recovery mechanism for a bad release, so this is
          # enforced here rather than left to memory.
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag $tag is not 3-part (vMAJOR.MINOR.PATCH). A 4-part or pre-release tag would never be installed by the self-updater."
          }
          if ($tag -ne $expected) {
            throw "Pushed tag $tag does not match project version $expected."
          }
          # Publish as a DRAFT, upload the assets, and only then make it public and `latest`.
          #
          # `gh release create <assets>` creates the release FIRST and uploads after, so a
          # transient upload failure leaves a published, latest-marked release with no
          # HdtArenaHelper.dll — and the in-plugin self-updater looks that asset up by exact
          # name. Every client would then see a newer version it cannot fetch and nag daily,
          # and the job could not simply be re-run because the release already exists.
          # Draft-then-promote means `releases/latest` never exposes an asset-less release, and
          # `--clobber` keeps a re-run idempotent.
          $repo = '${{ github.repository }}'
          gh release create $tag --repo $repo --title $tag --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $tag." }

          gh release upload $tag '${{ steps.pkg.outputs.zip }}' 'dist/HdtArenaHelper/HdtArenaHelper.dll' `
            --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets for $tag." }

          # Fail loudly if the asset the updater depends on is not actually there.
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          if ($assets -notcontains 'HdtArenaHelper.dll') {
            throw "Release $tag is missing the HdtArenaHelper.dll asset; leaving it as a draft."
          }

          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub release $tag." }
